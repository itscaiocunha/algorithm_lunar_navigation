<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Light and shadow computation time per instant</title>
<desc id="d">Python loop, pixel by pixel (same code, one pixel per call): 54 min; NumPy, whole grid (loop over distance, not over pixels): 18.3 s; NumPy in blocks of 65,536 px (bit-for-bit identical to the two above): 8.6 s; Horizon map (one-time 34-min precomputation · ~99.8% equal): 106 ms</desc>
