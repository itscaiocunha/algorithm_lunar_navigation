name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"
  PNPM_VERSION: "11.1.3"

jobs:
  frontend:
    name: Frontend · tsc, oxlint, vitest, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install -g pnpm@${{ env.PNPM_VERSION }}
      - id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Tipos (tsc)
        run: pnpm exec tsc -b
      - name: Lint (oxlint, avisos reprovam)
        run: pnpm exec oxlint --deny-warnings src
      - name: Testes (vitest)
        run: pnpm exec vitest run
      - name: Build (vite)
        run: pnpm exec vite build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  backend:
    name: Backend · ruff, pytest
    runs-on: ubuntu-latest
    needs: frontend # o dist entra no teste do servidor estático
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check src tests scripts
      - id: dados
        uses: ./.github/actions/dados
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Testes (pytest)
        run: python -m pytest -q -rs -p no:cacheprovider | tee pytest.log
      - name: Resumo
        if: always()
        run: |
          {
            echo "### Backend"
            echo
            echo "\`$(tail -1 pytest.log)\`"
            echo
            if [ "${{ steps.dados.outputs.derived-hit }}" = "true" ]; then
              echo "Caches derivados (horizontes + análise anual) restaurados: suíte completa."
            else
              echo "Caches derivados ausentes: testes do modo rápido, da animação e da aba anual pulados."
              echo "Rode o workflow **Dados derivados** uma vez para gerá-los."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Imagem Docker · build e smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          load: true
          tags: lunar-navigator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (API, SPICE, DEM e dashboard dentro do contêiner)
        run: |
          docker run -d --name ln -p 8000:8000 lunar-navigator:ci
          for _ in $(seq 1 60); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf localhost:8000/api/info | tee info.json
          python3 - <<'EOF'
          import json
          info = json.load(open("info.json"))
          assert info["kernels_loaded"] == 6, info
          assert info["area_shape"] == [750, 750], info
          EOF
          curl -sf "localhost:8000/api/illumination?utc=2026-11-20T00:00:00Z&lat=-89.45&lon=-137.1" | python3 -m json.tool | head -20
          curl -sf "localhost:8000/api/countdown?utc=2026-11-20T00:00:00Z&lat=-89.45&lon=-137.1" > /dev/null
          curl -sf localhost:8000/ | grep -q '<div id="root">'
          docker stats --no-stream ln
      - if: failure()
        run: docker logs ln
