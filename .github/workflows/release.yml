name: Release

# Ao publicar uma tag v* (ex.: git tag v1.0.0 && git push --tags): constrói a imagem completa
# ("bundle": dados públicos + horizontes + análise anual) e publica no GitHub Container Registry.
# Exige que o workflow "Dados derivados" já tenha gerado o cache desta versão do algoritmo.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagem:
    name: Imagem bundle → ghcr.io
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: dados
        uses: ./.github/actions/dados
        with:
          publicos: "false" # o Dockerfile baixa kernels e DEM por conta própria
      - name: Exige os caches derivados
        if: steps.dados.outputs.derived-hit != 'true'
        run: |
          echo "::error::Caches derivados ausentes para esta versão do algoritmo. Rode o workflow 'Dados derivados' e repita."
          exit 1
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: bundle
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
