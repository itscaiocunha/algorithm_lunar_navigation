[project]
name = "lunar-navigator"
version = "0.1.0"
description = "Projeto algorítmico de navegação lunar (FastAPI + SpiceyPy + NumPy)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, bugbear, pyupgrade: conservador, sem ruído de estilo
select = ["E", "F", "W", "I", "B", "UP"]
